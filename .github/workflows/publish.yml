name: Publish Parent POM to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Deploy to local repo
        run: mvn deploy -DaltDeploymentRepository=local::default::file://$(pwd)/target/mvn-repo
        working-directory: mark59-parent

      - name: Check generated structure
        run: |
          echo "=== Contents of target/mvn-repo ==="
          find mark59-parent/target/mvn-repo -type f -name "*.pom" | head -20
          ls -la mark59-parent/target/mvn-repo/

      - name: Deploy to gh-pages branch
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Clean working directory completely
          rm -rf * .github .gitignore
          
          # Find and copy all POM files
          mkdir -p maven-repo
          cp -r mark59-parent/target/mvn-repo/* maven-repo/ 2>/dev/null || true
          
          git checkout --orphan gh-pages
          git add .
          git commit -m "Publish parent POM to GitHub Pages"
          git push -u origin gh-pages --force
