name: Publish Parent POM to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Deploy to local repo
        run: mvn deploy -DaltDeploymentRepository=local::default::file://$(pwd)/target/mvn-repo
        working-directory: mark59-parent

      - name: Deploy to gh-pages branch
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git checkout --orphan gh-pages
          git rm -rf .
          mkdir -p mark59-parent-pom/5.6.3.00
          cp -r mark59-parent/target/mvn-repo/mark59-parent-pom/mark59-parent-pom/* mark59-parent-pom/5.6.3.00/ 2>/dev/null || true
          git add .
          git commit -m "Publish parent POM to GitHub Pages"
          git push -u origin gh-pages --force
