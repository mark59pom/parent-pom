name: Publish Parent POM to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Deploy to local repo
        run: mvn deploy -DaltDeploymentRepository=local::default::file://$(pwd)/target/mvn-repo
        working-directory: mark59-parent

      - name: Deploy to gh-pages branch
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Clean everything first
          rm -rf *
          rm -rf .github
          
          # Create fresh directory structure
          mkdir -p mark59-parent-pom/5.6.3.00
          
          # Copy only the POM file and checksums
          cp mark59-parent/target/mvn-repo/mark59-parent-pom/mark59-parent-pom/5.6.3.00/mark59-parent-pom-5.6.3.00.pom mark59-parent-pom/5.6.3.00/
          cp mark59-parent/target/mvn-repo/mark59-parent-pom/mark59-parent-pom/5.6.3.00/mark59-parent-pom-5.6.3.00.pom.md5 mark59-parent-pom/5.6.3.00/
          cp mark59-parent/target/mvn-repo/mark59-parent-pom/mark59-parent-pom/5.6.3.00/mark59-parent-pom-5.6.3.00.pom.sha1 mark59-parent-pom/5.6.3.00/
          cp mark59-parent/target/mvn-repo/mark59-parent-pom/mark59-parent-pom/maven-metadata.xml mark59-parent-pom/
          cp mark59-parent/target/mvn-repo/mark59-parent-pom/mark59-parent-pom/maven-metadata.xml.md5 mark59-parent-pom/
          cp mark59-parent/target/mvn-repo/mark59-parent-pom/mark59-parent-pom/maven-metadata.xml.sha1 mark59-parent-pom/
          
          git checkout --orphan gh-pages
          git add .
          git commit -m "Publish parent POM to GitHub Pages"
          git push -u origin gh-pages --force
